        // Date Helpers
        function parseDateString(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatDateISO(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getWeekDatesForDate(currentDate) {
            const d = new Date(currentDate);
            const dayOfWeek = d.getDay(); // 0 is Sunday in JS
            const sunday = new Date(d);
            sunday.setDate(d.getDate() - dayOfWeek);

            const week = [];
            for (let i = 0; i < 7; i++) {
                const nextDay = new Date(sunday);
                nextDay.setDate(sunday.getDate() + i);
                week.push(nextDay);
            }
            return week;
        }

        function formatHebrewFullDate(dateStr) {
            try {
                const d = parseDateString(dateStr);
                const dayName = HEBREW_DAYS_FULL[d.getDay()];
                const dayNum = d.getDate();
                const monthName = HEBREW_MONTHS[d.getMonth()];
                const year = d.getFullYear();
                return `${dayName} ${dayNum} ${monthName} ${year}`;
            } catch (e) {
                return dateStr;
            }
        }

                return {

                    institution: 'אוניברסיטה / מכללה',
                    showWeekends: true
                };
            });

                try {
                    localStorage.setItem('roni_planner_events_v3', JSON.stringify(events));
                } catch (e) {

                }
            }, [events]);

                } catch (e) {}
            }, [userSettings]);

            // Date navigation helpers
            const activeDateObj = useMemo(() => parseDateString(selectedDate), [selectedDate]);
            const currentWeekDays = useMemo(() => getWeekDatesForDate(activeDateObj), [activeDateObj]);

            const currentMonthYearLabel = useMemo(() => {
                const monthName = HEBREW_MONTHS_SHORT[activeDateObj.getMonth()];
                const year = activeDateObj.getFullYear();
                return `${monthName}' ${year}`;
            }, [activeDateObj]);

            // Filter events for selected date
            const selectedDayEvents = useMemo(() => {
                if (!Array.isArray(events)) return [];
                return events.filter(e => e.date === selectedDate).sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
            }, [events, selectedDate]);

            // Notification counts (upcoming exams & incomplete tasks)
            const notificationList = useMemo(() => {

                return events.filter(e => {

                });

                                                            {event.startTime} - {event.endTime}
                                                        </span>
                                                        <button 
                                                            onClick={(e) => handleDeleteEvent(event.id, e)}
                                                            class="p-1 text-slate-400 hover:text-red-600 rounded"
                                                        >
                                                            <IconTrash className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* ================= FLOATING ACTION BUTTON (FAB) ================= */}
                    <button 
                        onClick={() => {
                            setEditingEvent({
                                title: '',
                                course: 'חדוו"א 2א',
                                type: 'הרצאה',
                                date: selectedDate,
                                startTime: '10:00',
                                endTime: '12:00',
                                location: '',
                                priority: 'בינונית',
                                completed: false,
                                notes: ''
                            });
                            setActiveModal('add');
                        }}
                        title="הוסף אירוע או מטלה חדשה"
                        class="fixed bottom-6 left-6 z-40 bg-[#aed500] hover:bg-[#9ec200] text-[#162238] w-14 h-14 rounded-full flex items-center justify-center shadow-2xl border-2 border-[#162238]/20 transition-all transform hover:scale-110 active:scale-95 focus:outline-none"
                    >
                        <IconPlus className="w-8 h-8 stroke-[3]" />
                    </button>

                    {/* ================= MODAL DIALOGS ================= */}
                    {activeModal && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
                            
                            {/* MODAL 1: ADD / EDIT EVENT MODAL */}
                            {activeModal === 'add' && editingEvent && (
                                <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 flex flex-col gap-4 dir-rtl my-8">
                                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                        <h2 class="text-lg font-black text-slate-900">
                                            {editingEvent.id ? 'עריכת אירוע' : 'הוספת אירוע / מטלה חדשה'}
                                        </h2>
                                        <button onClick={() => setActiveModal(null)} class="p-1 text-slate-400 hover:text-slate-600">
                                            <IconX className="w-5 h-5" />
                                        </button>
                                    </div>

                                    <form onSubmit={(e) => { e.preventDefault(); handleSaveEvent(editingEvent); }} class="flex flex-col gap-3 text-xs font-bold text-slate-700">
                                        
                                        {/* Title */}
                                        <div>
                                            <label class="block mb-1">כותרת האירוע / המטלה *</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={editingEvent.title} 
                                                onChange={e => setEditingEvent({ ...editingEvent, title: e.target.value })}
                                                placeholder="לדוגמה: הרצאה שבועית / הגשת תרגיל בית 3" 
                                                class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#82a300] text-sm"
                                            />
                                        </div>

                                        {/* Course Name with Quick Tags */}
                                        <div>
                                            <label class="block mb-1">שם הקורס *</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={editingEvent.course} 
                                                onChange={e => setEditingEvent({ ...editingEvent, course: e.target.value })}
                                                placeholder="שם הקורס" 
                                                class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#82a300] text-sm"
                                            />
                                            <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                                                <span class="text-[10px] text-slate-400 font-normal">תגיות מהירות:</span>
                                                {['חדוו"א 2א', 'אלגברה לינארית', 'פיזיקה קלאסית', 'מבוא למדעי המחשב', 'אישי'].map(tag => (
                                                    <button 
                                                        type="button" 
                                                        key={tag}
                                                        onClick={() => setEditingEvent({ ...editingEvent, course: tag })}
                                                        class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md text-[10px]"
                                                    >
                                                        {tag}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Type Selector */}
                                        <div>
                                            <label class="block mb-1">סוג האירוע</label>
                                            <div class="grid grid-cols-3 sm:grid-cols-5 gap-1.5">
                                                {Object.keys(EVENT_TYPES).map(typeKey => (
                                                    <button 
                                                        type="button"
                                                        key={typeKey}
                                                        onClick={() => setEditingEvent({ ...editingEvent, type: typeKey })}
                                                        class={`py-1.5 px-2 rounded-xl text-xs font-extrabold border transition flex flex-col items-center gap-0.5 ${
                                                            editingEvent.type === typeKey ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200'
                                                        }`}
                                                    >
                                                        <span>{EVENT_TYPES[typeKey].icon}</span>
                                                        <span>{typeKey}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Date & Time Row */}
                                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            <div>
                                                <label class="block mb-1">תאריך</label>
                                                <input 
                                                    type="date" 
                                                    required
                                                    value={editingEvent.date} 
                                                    onChange={e => setEditingEvent({ ...editingEvent, date: e.target.value })}
                                                    class="w-full px-3 py-1.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#82a300]"
                                                />
                                            </div>
                                            <div>
                                                <label class="block mb-1">שעת התחלה</label>
                                                <input 
                                                    type="time" 
                                                    required
                                                    value={editingEvent.startTime} 
                                                    onChange={e => setEditingEvent({ ...editingEvent, startTime: e.target.value })}
                                                    class="w-full px-3 py-1.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#82a300] dir-ltr"
                                                />
                                            </div>
                                            <div>
                                                <label class="block mb-1">שעת סיום</label>
                                                <input 
                                                    type="time" 
                                                    required
                                                    value={editingEvent.endTime} 
                                                    onChange={e => setEditingEvent({ ...editingEvent, endTime: e.target.value })}
                                                    class="w-full px-3 py-1.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#82a300] dir-ltr"
                                                />
                                            </div>
                                        </div>

                                        {/* Location & Priority */}
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                            <div>
                                                <label class="block mb-1">מיקום / אולם</label>
                                                <input 
                                                    type="text" 
                                                    value={editingEvent.location || ''} 
                                                    onChange={e => setEditingEvent({ ...editingEvent, location: e.target.value })}
                                                    placeholder="אולם 101 / Moodle / בזום" 
                                                    class="w-full px-3 py-1.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#82a300]"
                                                />
                                            </div>
                                            <div>
                                                <label class="block mb-1">רמת עדיפות</label>
                                                <select 
                                                    value={editingEvent.priority || 'בינונית'}
                                                    onChange={e => setEditingEvent({ ...editingEvent, priority: e.target.value })}
                                                    class="w-full px-3 py-1.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#82a300]"
                                                >
                                                    <option value="נמוכה">נמוכה</option>
                                                    <option value="בינונית">בינונית</option>
                                                    <option value="גבוהה">גבוהה ⚡</option>
                                                </select>
                                            </div>
                                        </div>

                                        {/* Notes */}
                                        <div>
                                            <label class="block mb-1">הערות ופירוט</label>
                                            <textarea 
                                                rows="2"
                                                value={editingEvent.notes || ''} 
                                                onChange={e => setEditingEvent({ ...editingEvent, notes: e.target.value })}
                                                placeholder="נושאי לימוד, דגשים מיוחדים, קישורים..." 
                                                class="w-full px-3 py-1.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#82a300]"
                                            ></textarea>
                                        </div>

                                        {/* Form Actions */}
                                        <div class="flex items-center justify-end gap-2 border-t border-slate-100 pt-3 mt-2">
                                            <button 
                                                type="button"
                                                onClick={() => setActiveModal(null)}
                                                class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-bold"
                                            >
                                                ביטול
                                            </button>
                                            <button 
                                                type="submit"
                                                class="bg-[#162238] hover:bg-[#233554] text-white px-5 py-2 rounded-xl font-black shadow transition active:scale-95"
                                            >
                                                שמור אירוע
                                            </button>
                                        </div>

                                    </form>
                                </div>
                            )}

                            {/* MODAL 2: NOTIFICATIONS MODAL */}
                            {activeModal === 'notifications' && (
                                <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 flex flex-col gap-4 dir-rtl">
                                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                        <div class="flex items-center gap-2">
                                            <IconBell className="w-5 h-5 text-amber-500" />
                                            <h2 class="text-lg font-black text-slate-900">התראות ומטלות קרובות</h2>
                                        </div>
                                        <button onClick={() => setActiveModal(null)} class="p-1 text-slate-400 hover:text-slate-600">
                                            <IconX className="w-5 h-5" />
                                        </button>
                                    </div>

                                    <div class="flex flex-col gap-2 max-h-80 overflow-y-auto">
                                        {notificationList.length > 0 ? (
                                            notificationList.map(item => (
                                                <div key={item.id} class="p-3 rounded-2xl bg-amber-50 border border-amber-200 flex items-start gap-3">
                                                    <span class="text-lg">⚡</span>
                                                    <div class="flex-1 text-xs">
                                                        <div class="font-extrabold text-amber-900">{item.title} ({item.course})</div>
                                                        <div class="text-amber-700 mt-0.5">תאריך יעד: {formatHebrewFullDate(item.date)}</div>
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            <div class="text-center py-8 text-xs text-slate-500">
                                                אין התראות חדשות! כל המטלות והמבחנים מטופלים.
                                            </div>
                                        )}
                                    </div>

                                    <button 
                                        onClick={() => setActiveModal(null)}
                                        class="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs"
                                    >
                                        סגור
                                    </button>
                                </div>
                            )}

                            {/* MODAL 3: IMPORT / EXPORT MODAL */}
                            {activeModal === 'import' && (
                                <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 flex flex-col gap-4 dir-rtl">
                                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                        <div class="flex items-center gap-2">
                                            <IconFileExcel className="w-5 h-5 text-emerald-600" />
                                            <h2 class="text-lg font-black text-slate-900">ייבוא וייצוא נתונים</h2>
                                        </div>
                                        <button onClick={() => setActiveModal(null)} class="p-1 text-slate-400 hover:text-slate-600">
                                            <IconX className="w-5 h-5" />
                                        </button>
                                    </div>

                                    <p class="text-xs text-slate-600">
                                        תוכל לקשר את מערכת השעות שלך מ-Excel, Moodle או לחזור לנתוני ברירת המחדל.
                                    </p>

                                    <div class="flex flex-col gap-2">
                                        <button 
                                            onClick={handleResetSampleData}
                                            class="w-full bg-[#aed500] hover:bg-[#9ec200] text-[#162238] font-black p-3 rounded-2xl text-xs shadow transition flex items-center justify-center gap-2"
                                        >
                                            <span>🔄 טען מערכת שעות מלאה לדוגמה (נובמבר 2026)</span>
                                        </button>

                                        <button 
                                            onClick={() => {
                                                const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(events, null, 2));
                                                const dlAnchor = document.createElement('a');
                                                dlAnchor.setAttribute("href", jsonStr);
                                                dlAnchor.setAttribute("download", "roni_planner_backup.json");
                                                document.body.appendChild(dlAnchor);
                                                dlAnchor.click();
                                                dlAnchor.remove();
                                            }}
                                            class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold p-3 rounded-2xl text-xs transition flex items-center justify-center gap-2 border border-slate-200"
                                        >
                                            <span>💾 ייצא גיבוי לוח שנה (JSON)</span>
                                        </button>
                                    </div>

                                    <button 
                                        onClick={() => setActiveModal(null)}
                                        class="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs mt-2"
                                    >
                                        סגור
                                    </button>
                                </div>
                            )}

                            {/* MODAL 4: SETTINGS MODAL */}
                            {activeModal === 'settings' && (
                                <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 flex flex-col gap-4 dir-rtl">
                                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                        <div class="flex items-center gap-2">
                                            <IconGear className="w-5 h-5 text-slate-700" />
                                            <h2 class="text-lg font-black text-slate-900">הגדרות פלאנר</h2>
                                        </div>
                                        <button onClick={() => setActiveModal(null)} class="p-1 text-slate-400 hover:text-slate-600">
                                            <IconX className="w-5 h-5" />
                                        </button>
                                    </div>

                                    <div class="flex flex-col gap-3 text-xs font-bold text-slate-700">
                                        <div>
                                            <label class="block mb-1">שם הסטודנט / הסטודנטית</label>
                                            <input 
                                                type="text" 
                                                value={userSettings.studentName}
                                                onChange={e => setUserSettings({ ...userSettings, studentName: e.target.value })}
                                                class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none text-sm"
                                            />
                                        </div>

                                        <div>
                                            <label class="block mb-1">מוסד לימודים</label>
                                            <input 
                                                type="text" 
                                                value={userSettings.institution}
                                                onChange={e => setUserSettings({ ...userSettings, institution: e.target.value })}
                                                class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none text-sm"
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => setActiveModal(null)}
                                        class="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs mt-2"
                                    >
                                        שמור וסגור
                                    </button>
                                </div>
                            )}

                        </div>
                    )}

                </div>
            );
        }

        // Render React Application safely after DOM load
        window.addEventListener('DOMContentLoaded', () => {
            const rootElement = document.getElementById('root');
            if (rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<MainApp />);
            }
        });
    </script>
</body>
</html>
